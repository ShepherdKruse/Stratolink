[env:stratolink]
platform = ststm32
board = stratolink
framework = arduino
boards_dir = boards
build_type = debug

monitor_speed = 115200
upload_protocol = jlink
debug_tool = custom
debug_server =
    JLinkGDBServerCL
    -device
    STM32WLE5CC
    -if
    SWD
    -speed
    4000

lib_deps =
    sparkfun/SparkFun u-blox GNSS v3@^3.1.7
    stm32duino/STM32duino Low Power@^1.2.0
    jgromes/RadioLib@^7.6.0
build_unflags = -DCUSTOM_PERIPHERAL_PINS

build_flags =
    -D ARDUINO_ARCH_STM32
    -D ARDUINO_RAK3172_MODULE
    -D HAL_UART_MODULE_ENABLED
    -D HAL_ADC_MODULE_ENABLED
    -D HAL_IWDG_MODULE_ENABLED
    -D HAL_TIM_MODULE_ONLY
    -D ENABLE_HWSERIAL1
    -D PIN_SERIAL1_TX=PB_6
    -D PIN_SERIAL1_RX=PB_7
    ; LoRaWAN region is no longer compile-time pinned, runtime-selected
    ; from GPS lat/lon by region_manager.cpp.  Removed: -D REGION_US915.
    ; STM32duino delayMicroseconds() in wiring_time.h reads DWT->CYCCNT into a
    ; signed int32, so once elapsed cycles cross 0x7FFFFFFF (~45 s after the
    ; start capture at 48 MHz) the signed compare flips negative and the loop
    ; never exits.  RadioLib's SPI wrapper hits this inside lorawan_init() and
    ; the firmware never reaches loop().  Falls back to the SysTick path.
    -D DWT_DELAY_DISABLED
    -I include
    ; ADC sample time tuning for VSTOR/SOLAR, 1 MΩ + 1 MΩ dividers (R19/R21
    ; on solar, R22/R23 on VSTOR) make Thévenin source impedance 500 kΩ.
    ; STM32duino default 19.5 cycles at 4 MHz ADC clock (~5 µs) settles to
    ; <1% of source, too inaccurate for tier gating. 160.5 cycles ≈ 40 µs
    ; settles to <0.05% of source, well within 12-bit accuracy.
    -D ADC_SAMPLINGTIME=ADC_SAMPLETIME_160CYCLES_5

build_src_filter = +<*> -<main_power_test.cpp> -<main_region_test.cpp> -<main_gps_diag.cpp> -<main_gps_diag2.cpp> -<main_gps_iprobe.cpp>

[env:gps_diag]
; Continuous-GPS bring-up diagnostic (see src/main_gps_diag.cpp). Runs the
; u-blox flat-out and exposes live SIV/fix state in the `gd` RAM struct, read
; over J-Link. Tells "GPS antenna dead" from "30 s/cycle budget too short".
extends = env:stratolink
build_src_filter = -<*> +<main_gps_diag.cpp>
; Only the u-blox lib, drop RadioLib/LowPower (RadioLib's STM32WL HAL needs
; SubGhz.h which isn't pulled in this minimal source set, and we don't use it).
lib_deps = sparkfun/SparkFun u-blox GNSS v3@^3.1.7

[env:gps_diag2]
; Sleep/wake WEDGE diagnostic (see src/main_gps_diag2.cpp). Replicates the real
; firmware GPS cycle and measures per-cycle whether the module answers after its
; backup nap, `gw.consec_no_resp` climbing is the flight STALE bug, live.
extends = env:stratolink
build_src_filter = -<*> +<main_gps_diag2.cpp>
lib_deps = sparkfun/SparkFun u-blox GNSS v3@^3.1.7

[env:gps_iprobe]
; GPS I2C wedge-probe (see src/main_gps_iprobe.cpp). Runs the real UART sleep/wake
; cycle AND probes the GPS DDC at I2C 0x42 each cycle (awake + in-backup) to learn
; whether a UART-wedged module still answers on I2C, a BBR-safe recovery path that
; would avoid the cold-start cost of a PA0 reset (EXTINT is GND-tied on this board).
; Adds Wire to the diag; still no RadioLib (avoids the SubGhz.h LDF error).
extends = env:stratolink
build_src_filter = -<*> +<main_gps_iprobe.cpp>
lib_deps = sparkfun/SparkFun u-blox GNSS v3@^3.1.7

[env:power_test]
extends = env:stratolink
build_src_filter = +<main_power_test.cpp> +<power_adc.cpp>

[env:region_test]
; Stress test for runtime LoRaWAN region switching + TAMP session
; persistence.  Streams PASS/FAIL log over Serial1 @ 115200.  See
; src/main_region_test.cpp for what it exercises.
extends = env:stratolink
build_src_filter = -<main.cpp> -<main_power_test.cpp> +<main_region_test.cpp>
              +<region_manager.cpp> +<lorawan.cpp> +<power_manager.cpp>
              +<power_adc.cpp> +<gps_ublox.cpp> +<sensors.cpp>
              +<sensor_tmp117.cpp> +<sensor_ms5611.cpp>
              +<sensor_lis2dh12.cpp> +<sensor_ltr390.cpp>
              +<mic_acoustic.cpp> +<telemetry.cpp>
